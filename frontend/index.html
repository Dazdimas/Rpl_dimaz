<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pencatat Keuangan</title>
    <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
    <div class="container">
        <h1>Pencatat Keuangan</h1>

        <section class="summary">
            <div class="card">
                <label>Saldo Awal</label>
                <strong id="saldoAwal">Rp 0</strong>
            </div>
            <div class="card pemasukan">
                <label>Pemasukan</label>
                <strong id="totalPemasukan">Rp 0</strong>
            </div>
            <div class="card pengeluaran">
                <label>Pengeluaran</label>
                <strong id="totalPengeluaran">Rp 0</strong>
            </div>
            <div class="card saldo">
                <label>Saldo Akhir</label>
                <strong id="saldoAkhir">Rp 0</strong>
            </div>
        </section>

        <section class="form-box">
            <h2 id="formTitle">Tambah Transaksi</h2>
            <form id="formTransaksi">
                <div class="grid-form">
                    <div>
                        <label for="tanggal">Tanggal</label>
                        <input type="date" id="tanggal" name="tanggal" required />
                    </div>
                    <div>
                        <label for="jenis">Jenis</label>
                        <select id="jenis" name="jenis" required>
                            <option value="pemasukan">Pemasukan</option>
                            <option value="pengeluaran">Pengeluaran</option>
                        </select>
                    </div>
                    <div>
                        <label for="kategori">Kategori</label>
                        <select id="kategori" name="kategori" required></select>
                    </div>
                    <div>
                        <label for="nominal">Nominal</label>
                        <input type="number" id="nominal" name="nominal" min="1" required />
                    </div>
                    <div>
                        <label for="keterangan">Keterangan</label>
                        <input type="text" id="keterangan" name="keterangan" placeholder="Contoh: Gaji bulanan" required />
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" id="btnSimpan">Simpan Transaksi</button>
                    <button type="button" id="btnBatal" class="btn-secondary" hidden>Batal Edit</button>
                </div>
            </form>
        </section>

        <section class="two-col">
            <div class="form-box">
                <h2>Batas Anggaran Bulanan</h2>
                <form id="formBudget" class="budget-form">
                    <div>
                        <label for="budgetBulanan">Batas pengeluaran per bulan</label>
                        <input type="number" id="budgetBulanan" min="0" required />
                    </div>
                    <div>
                        <label for="bulanBudget">Bulan</label>
                        <input type="month" id="bulanBudget" />
                    </div>
                    <button type="submit">Simpan Batas</button>
                </form>

                <div class="progress">
                    <div class="progress-bar" id="budgetBar"></div>
                </div>
                <p id="budgetInfo" class="muted"></p>
            </div>

            <div class="form-box">
                <h2>Pengeluaran per Kategori</h2>
                <div class="chart-wrap">
                    <canvas id="chartPengeluaran"></canvas>
                </div>
                <p id="chartKosong" class="muted" hidden>Belum ada pengeluaran pada data yang ditampilkan.</p>
            </div>
        </section>

        <section class="table-box">
            <h2>Riwayat Transaksi</h2>

            <div class="filter-bar">
                <div>
                    <label for="filterDari">Dari tanggal</label>
                    <input type="date" id="filterDari" />
                </div>
                <div>
                    <label for="filterSampai">Sampai tanggal</label>
                    <input type="date" id="filterSampai" />
                </div>
                <div>
                    <label for="filterKategori">Kategori</label>
                    <select id="filterKategori">
                        <option value="">Semua kategori</option>
                    </select>
                </div>
                <div>
                    <button type="button" id="btnResetFilter" class="btn-secondary">Reset Filter</button>
                </div>
            </div>

            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>Tanggal</th>
                            <th>Jenis</th>
                            <th>Kategori</th>
                            <th>Keterangan</th>
                            <th>Nominal</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </section>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <script src="assets/app.js"></script>
</body>
</html>
